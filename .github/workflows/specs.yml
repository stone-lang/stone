name: Specs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  specs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install LLVM
        run: |
          LLVM_VERSION=21
          if command -v brew >/dev/null 2>&1; then
            echo "Installing LLVM via Homebrew..."
            brew install llvm@${LLVM_VERSION} 2>/dev/null || brew install llvm
          elif command -v apt-get >/dev/null 2>&1; then
            echo "Installing LLVM ${LLVM_VERSION} via apt-get..."
            sudo apt-get update
            sudo apt-get install -y llvm-${LLVM_VERSION}-dev llvm-${LLVM_VERSION} 2>/dev/null || \
            sudo apt-get install -y llvm-dev llvm
          fi

      - name: Set LLVM environment variables
        run: |
          if command -v brew >/dev/null 2>&1; then
            LLVM_PREFIX=$(brew --prefix llvm)
          elif [ -d /usr/lib/llvm-21 ]; then
            LLVM_PREFIX=/usr/lib/llvm-21
          elif command -v llvm-config-21 >/dev/null 2>&1; then
            LLVM_PREFIX=$(llvm-config-21 --prefix)
          elif command -v llvm-config >/dev/null 2>&1; then
            LLVM_PREFIX=$(llvm-config --prefix)
          else
            echo "ERROR: Could not find LLVM installation"
            exit 1
          fi
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "LDFLAGS=-L$LLVM_PREFIX/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$LLVM_PREFIX/include" >> $GITHUB_ENV

      - name: Install mise and the tools from its config
        uses: jdx/mise-action@v3

      - name: Setup and run specs
        run: make setup specs
